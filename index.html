<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer AI Detection</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
        }
        h2 { color: #1e3a8a; margin-bottom: 20px; }
        .upload-btn { 
            border: 2px dashed #3b82f6; 
            padding: 25px; 
            border-radius: 8px; 
            cursor: pointer; 
            background: #eff6ff; 
            color: #1d4ed8; 
            margin-bottom: 20px; 
            font-weight: 600; 
            display: block;
        }
        input[type="file"] { display: none; }
        button { 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
        }
        button:hover { background: #1d4ed8; }
        #result-box { 
            margin-top: 20px; 
            font-size: 18px; 
            font-weight: bold; 
            display: none; 
            padding: 15px; 
            border-radius: 6px; 
        }
        .benign { background: #dcfce7; color: #15803d; }
        .malignant { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔬 AI Breast Cancer Detection</h2>
    
    <label class="upload-btn" for="fileInput" id="uploadLabel">
        📸 Click to Upload Image
    </label>
    <input type="file" id="fileInput" accept="image/*" onchange="previewFile()">

    <button onclick="uploadImage()">Analyze Image</button>

    <div id="result-box"></div>
</div>

<script>
    // ✅ সঠিকভাবে /predict সহ সম্পূর্ণ API URL ডিক্লেয়ার করা হয়েছে
   const API_URL = "https://breast-cencer-detection-ai-final.onrender.com/predict";

async function uploadImage() {
    const fileInput = document.getElementById("fileInput"); // Match your input element ID
    const resultElement = document.getElementById("result");   // Match your output container ID

    if (!fileInput || !fileInput.files[0]) {
        alert("Please select an image file first.");
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    // Show loading state
    if (resultElement) {
        resultElement.innerText = "⏳ Processing image...";
    }

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            body: formData,
        });

        // Check if server returned a 500 or any non-OK HTTP status code
        if (!response.ok) {
            if (response.status === 500) {
                if (resultElement) {
                    resultElement.innerText = "❌ Connection Error!\nServer status: 500";
                }
                return;
            }
            throw new Error(`Server status: ${response.status}`);
        }

        const data = await response.json();

        // Update output with prediction results
        if (resultElement) {
            resultElement.innerText = `Result: ${data.result}\nConfidence: ${data.confidence}`;
        }

    } catch (error) {
        console.error("Fetch error details:", error);
        
        // Output format on any connection or server error
        if (resultElement) {
            resultElement.innerText = "❌ Connection Error!\nServer status: 500";
        }
    }
}
</script>

</body>
</html>
